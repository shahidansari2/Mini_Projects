<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix 1st Pg</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page1">
        <nav id="nav">
             <div id="logo"><img src="Netflix Logo.png">
            </div>
            <div id="langsign">
                <div style="color: rgb(255, 243, 243);" id="langdiv">
                    <i class="fa-solid fa-language"></i>
            <form action="#">
                <select name="lang" id="lang">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                </select>
            </form>
        </div>
        <div id="sign">
                sign In
            </div>
            </div>
        </nav>

        <div id="center">
            <h1>Unlimited movies, shows, and more</h1>
            <h3>Starts at ₹149. Cancel at any time.</h3>
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
            <div id="bottombutton">
                <div id="emaildiv"><form id="email" action="#">
                <input type="email" placeholder="Email address">
            </form></div>
             <div id="getstart">Get Started</div>
            </div>
        </div>
    </div>
    <div class="page2">

    </div>
</body>
</html>
